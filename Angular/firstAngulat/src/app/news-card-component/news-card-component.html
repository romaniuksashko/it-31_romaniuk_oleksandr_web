<div class="card">
  <h3 class="card__title">{{title}}</h3>
  <p class="card__text">На півночі Франції в Живерні постраждав історичний сад художника-імпресіоніста Клода Моне через аномальну спеку цього
  літа. Втрачена частина рослин.</p>
  <p class="card__author">{{author}}</p>
  <button type="button" (click)="buttonClicked()" class="card__button">Читати</button>
</div>
